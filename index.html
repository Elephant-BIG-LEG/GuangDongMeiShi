<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>广东美食</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="https://elephant-big-leg.github.io/GuangDongMeiShi/" class="site-link">广东美食-十里河店</a>
      <div class="logo">
        <span class="logo-icon">🍽️</span>
        <h1>广东美食</h1>
      </div>
      <p class="tagline">匠心传承 · 地道粤味</p>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-category="dishes">
      <span class="nav-icon">🥢</span>
      <span class="nav-text">招牌菜品</span>
    </button>
    <button class="nav-btn" data-category="environment">
      <span class="nav-icon">🏮</span>
      <span class="nav-text">环境雅座</span>
    </button>
    <button class="nav-btn" data-category="videos">
      <span class="nav-icon">🎬</span>
      <span class="nav-text">视频展示</span>
    </button>
  </nav>

  <main class="main">
    <section id="dishes" class="content-section active">
      <div class="section-header">
        <h2>招牌菜品</h2>
        <div class="section-line"></div>
      </div>
      <div class="gallery-grid">
        <div class="gallery-item" data-type="image">
          <img src="assets/images/dishes/juxie.jpg" alt="广东美食" loading="lazy">
          <div class="item-overlay"><span class="item-name">焗蟹</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/dishes/腊味煲仔饭.jpg" alt="广东美食" loading="lazy">
          <div class="item-overlay"><span class="item-name">腊味煲仔饭</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/dishes/烧鸭.jpg" alt="广东美食" loading="lazy">
          <div class="item-overlay"><span class="item-name">烧腊-烧鸭</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/dishes/泡椒凤爪.jpg" alt="广东美食" loading="lazy">
          <div class="item-overlay"><span class="item-name">泡椒凤爪</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/dishes/卤水拼盘.jpg" alt="广东美食" loading="lazy">
          <div class="item-overlay"><span class="item-name">卤水拼盘</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/dishes/猪耳.jpg" alt="广东美食" loading="lazy">
          <div class="item-overlay"><span class="item-name">猪耳</span></div>
        </div>
      </div>
    </section>

    <section id="environment" class="content-section">
      <div class="section-header">
        <h2>环境雅座</h2>
        <div class="section-line"></div>
      </div>
      <div class="gallery-grid">
        <div class="gallery-item" data-type="image">
          <img src="assets/images/environment/room1.jpg" alt="餐厅环境" loading="lazy">
          <div class="item-overlay"><span class="item-name">大厅雅座</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/environment/room2.jpg" alt="餐厅环境" loading="lazy">
          <div class="item-overlay"><span class="item-name">豪华包间</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/environment/room3.jpg" alt="餐厅环境" loading="lazy">
          <div class="item-overlay"><span class="item-name">茶室清幽</span></div>
        </div>
        <div class="gallery-item" data-type="image">
          <img src="assets/images/environment/room4.jpg" alt="餐厅环境" loading="lazy">
          <div class="item-overlay"><span class="item-name">园林景致</span></div>
        </div>
      </div>
    </section>

    <section id="videos" class="content-section">
      <div class="section-header">
        <h2>视频展示</h2>
        <div class="section-line"></div>
      </div>
      <div class="video-grid">
        <div class="video-item">
          <video controls preload="metadata" poster="assets/images/dishes/kongxincaifengmian.png">
            <source src="assets/videos/kongxincai.mp4" type="video/mp4">
          </video>
          <p class="video-title">爆炒空心菜</p>
        </div>
        <div class="video-item">
          <video controls preload="metadata" poster="assets/images/dishes/龙虾封面.png">
            <source src="assets/videos/龙虾.mp4" type="video/mp4">
          </video>
          <p class="video-title">龙虾</p>
        </div>
        <div class="video-item">
          <video controls preload="metadata" poster="assets/images/dishes/砂锅焗鱼封面.png">
            <source src="assets/videos/砂锅焗鱼.mp4" type="video/mp4">
          </video>
          <p class="video-title">砂锅焗鱼</p>
        </div>
        <div class="video-item">
          <video controls preload="metadata" poster="assets/images/dishes/反沙芋头封面.png">
            <source src="assets/videos/反沙芋头.mp4" type="video/mp4">
          </video>
          <p class="video-title">砂锅焗鱼</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 广东美食 · 匠心传承</p>
  </footer>

  <div id="imageModal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <script src="scripts.js"></script>
</body>
</html>
